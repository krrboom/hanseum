<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>한숨 · 대나무숲</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Hahmlet:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet">
<style>
  :root{--bg:#070b0f;--paper:#e9e4d6;--moss:#8aa08a;--dim:#7d8d80;--amber:#ffb26b;--line:rgba(233,228,214,.18);--px:"Galmuri11","Galmuri9",monospace;--pxl:"Galmuri14","Galmuri11",monospace}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--paper);font-family:"Gowun Batang","Noto Serif KR",Georgia,serif;overflow:hidden;touch-action:none}
  h1,h4,#title .q,#toast .n,#whisper,#sign .l,#hud b{font-family:"Hahmlet","Gowun Batang","Noto Serif KR",serif}
  canvas{display:block}
  button{font-family:inherit}
  #snd,#chr,#near button,#toast button,#form .opts button,#tin button,#talkbtn,#cairn button,#sndp .mute,#talk h4 button{background:rgba(7,11,15,.62);border:8px solid transparent;border-image:url(art/frame_btn.png) 16 repeat;image-rendering:pixelated;color:var(--paper);font-family:var(--px);font-size:12px;letter-spacing:.1em;padding:3px 10px;cursor:pointer;transition:filter .15s,transform .05s;text-shadow:1px 1px 0 #000}
  #snd:hover,#chr:hover,#near button:not(:disabled):hover,#toast button:hover,#form .opts button:hover,#tin button:not(:disabled):hover,#talkbtn:hover,#cairn button:hover,#sndp .mute:hover,#talk h4 button:hover{border-image:url(art/frame_hi.png) 16 repeat;filter:brightness(1.1)}
  #snd:active,#chr:active,#near button:not(:disabled):active,#toast button:active,#form .opts button:active,#tin button:active,#talkbtn:active,#cairn button:active,#sndp .mute:active{transform:translateY(1px)}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  ::selection{background:var(--moss);color:var(--bg)}
  *{scrollbar-width:thin;scrollbar-color:var(--moss) transparent}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--moss)}::-webkit-scrollbar-track{background:transparent}
  textarea{caret-color:var(--amber)}
  #ui{position:fixed;inset:0;pointer-events:none}
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.55) 100%)}
  #fogfx{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(233,228,214,.42) 0%,rgba(233,228,214,.28) 30%,rgba(233,228,214,0) 72%);opacity:0;transition:opacity .25s}
  #hud{position:absolute;left:10px;top:10px;font-family:var(--px);font-size:11px;letter-spacing:.15em;color:var(--moss);text-shadow:1px 1px 0 #000;border:14px solid transparent;border-image:url(art/frame.png) 16 fill repeat;image-rendering:pixelated;padding:0 6px 4px;background:none}
  #hud b{display:block;font-weight:400;font-family:var(--pxl);font-size:16px;letter-spacing:.4em;color:var(--paper);margin-bottom:4px}
  #hud small{display:block;letter-spacing:.05em;margin-top:4px}
  #whisper{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--pxl);font-size:clamp(15px,2.6vw,21px);line-height:1.9;letter-spacing:.06em;color:var(--paper);opacity:0;transition:opacity 1.4s;text-shadow:2px 2px 0 #000;padding:0 36px;white-space:pre-line}
  #whisper.on{opacity:.92}
  #whisper i{display:block;font-style:normal;font-family:var(--px);font-size:11px;letter-spacing:.3em;color:var(--moss);margin-bottom:8px}
  #near{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);min-width:220px;max-width:min(78vw,420px);pointer-events:auto;border:14px solid transparent;border-image:url(art/frame.png) 16 fill repeat;image-rendering:pixelated;padding:2px 8px 6px;font-family:var(--pxl);font-size:14px;line-height:1.8;text-align:center}
  #near .t{white-space:pre-line}
  #near .m{font-family:var(--px);font-size:11px;letter-spacing:.2em;color:var(--moss);margin-bottom:6px}
  #near button{margin-top:8px;font-size:13px;letter-spacing:.3em;padding:4px 18px}
  #near button:disabled{opacity:.45;cursor:default}
  #breath{--p:0;position:absolute;left:50%;bottom:52px;transform:translateX(-50%);pointer-events:auto;width:96px;height:96px;border:none;background:url(art/breath.png) center/100% 100% no-repeat;image-rendering:pixelated;color:var(--paper);font-family:var(--px);font-size:12px;letter-spacing:.3em;text-indent:.3em;padding:54px 0 0;box-sizing:border-box;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .2s;text-shadow:1px 1px 0 #000}
  #breath.hold{background-image:url(art/breath_hold.png);transform:translateX(-50%) scale(1.08)}
  #breath::after{content:"";position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(var(--paper) calc(var(--p)*1turn),transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));pointer-events:none}
  #cairn{position:absolute;left:50%;top:17%;transform:translateX(-50%);width:min(82vw,360px);box-sizing:border-box;text-align:center;opacity:0;transition:opacity .5s;pointer-events:none;border:14px solid transparent;border-image:url(art/frame.png) 16 fill repeat;image-rendering:pixelated;padding:0 10px 8px}
  #cairn.on{opacity:1;pointer-events:auto}
  #cairn .k{font-family:var(--px);font-size:11px;letter-spacing:.4em;color:var(--moss);margin:2px 0 6px}
  #cairn .t{font-family:var(--pxl);font-size:13px;line-height:1.7;color:var(--paper);margin-bottom:8px}
  #cairn button{padding-left:30px;background-image:url(art/ic_talk.png);background-repeat:no-repeat;background-position:8px center;background-size:16px 16px}
  body.talking #cairn{display:none}
  @media (prefers-reduced-motion:reduce){#cairn{transition:none}}
  #sign{position:absolute;left:50%;top:17%;transform:translateX(-50%);max-width:min(82vw,480px);text-align:center;opacity:0;transition:opacity .7s;pointer-events:none;border:14px solid transparent;border-image:url(art/frame.png) 16 fill repeat;image-rendering:pixelated;padding:0 10px 6px}
  #sign .k{font-family:var(--px);font-size:11px;letter-spacing:.3em;color:var(--moss);margin-bottom:6px}
  #sign .l{font-family:var(--pxl);font-size:18px;line-height:1.7;color:var(--paper);text-shadow:2px 2px 0 #000}
  #sign.on{opacity:1}
  #hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-family:var(--px);font-size:11px;letter-spacing:.1em;color:var(--dim);text-shadow:1px 1px 0 #000}
  #chr,#snd{position:absolute;right:12px;pointer-events:auto;padding-left:28px;background-image:url(art/ic_char.png);background-repeat:no-repeat;background-position:6px center;background-size:16px 16px}
  #chr{bottom:56px}
  #chr[hidden]{display:none}
  #chrp{position:absolute;right:12px;bottom:96px;width:min(84vw,300px);pointer-events:auto;border:14px solid transparent;border-image:url(art/frame.png) 16 fill repeat;image-rendering:pixelated;padding:0 4px 2px;font-family:var(--px)}
  #chrp[hidden]{display:none}
  #chrp h4{margin:0 0 8px;font-weight:400;font-family:var(--px);font-size:12px;letter-spacing:.3em;color:var(--moss)}
  #chrp .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  #chrp .pick{background:rgba(233,228,214,.04);border:6px solid transparent;border-image:url(art/frame_btn.png) 16 repeat;image-rendering:pixelated;color:var(--paper);padding:4px 0 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--px);font-size:11px;letter-spacing:.05em}
  #chrp .pick:hover{border-image:url(art/frame_hi.png) 16 repeat}
  #chrp .pick img{width:40px;height:52px;object-fit:contain;image-rendering:pixelated}
  #chrp .pick i{width:36px;height:48px;background:linear-gradient(#e8dfc6 0 30%,#f0d2b4 30% 55%,#2a2f44 55%)}
  #chrp .pick.on{border-image:url(art/frame_hi.png) 16 repeat;background:rgba(255,178,107,.12)}
  .touch #chrp{bottom:150px}
  #snd{bottom:16px;background-image:url(art/ic_sound.png)}
  #sndp{position:absolute;right:12px;bottom:56px;width:min(78vw,260px);pointer-events:auto;border:14px solid transparent;border-image:url(art/frame.png) 16 fill repeat;image-rendering:pixelated;padding:0 6px 4px;font-family:var(--px);font-size:12px}
  #sndp[hidden]{display:none}
  #sndp h4{margin:0 0 8px;font-weight:400;font-family:var(--px);font-size:12px;letter-spacing:.3em;color:var(--moss)}
  #sndp .row{display:flex;align-items:center;gap:10px;margin:7px 0}
  #sndp .row label{flex:0 0 72px;letter-spacing:.08em;color:var(--paper);white-space:nowrap}
  #sndp .row label small{display:block;font-size:11px;color:var(--dim);letter-spacing:.05em}
  #sndp .row input{flex:1;min-width:0;height:18px;appearance:none;-webkit-appearance:none;background:repeating-linear-gradient(90deg,var(--dim) 0 4px,transparent 4px 7px) center/100% 4px no-repeat;cursor:pointer}
  #sndp .row input::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:12px;height:16px;background:var(--paper);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--paper)}
  #sndp .row input::-moz-range-thumb{width:8px;height:12px;border-radius:0;background:var(--paper);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--paper)}
  #sndp .row.master{padding-bottom:8px;margin-bottom:6px;border-bottom:2px dotted var(--dim)}
  #sndp .mute{margin-top:8px;width:100%;font-size:11px;letter-spacing:.3em;padding:3px}
  #toast #ttalk{color:#b7c7b0;padding-left:30px;background-image:url(art/ic_talk.png);background-repeat:no-repeat;background-position:8px center;background-size:16px 16px}
  #talk{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(94vw,540px);max-height:64vh;display:flex;flex-direction:column;border:14px solid transparent;border-image:url(art/frame.png) 16 fill repeat;image-rendering:pixelated;border-bottom-width:0;pointer-events:auto;font-family:var(--pxl)}
  #talk[hidden]{display:none}
  #talk h4{margin:0;padding:2px 8px 6px;font-family:var(--px);font-size:12px;letter-spacing:.3em;color:var(--moss);display:flex;justify-content:space-between;align-items:center;font-weight:normal}
  #talk h4 button{color:var(--moss);font-size:11px;letter-spacing:.15em;padding:2px 8px}
  #tlog{overflow-y:auto;padding:4px 10px 8px;flex:1;font-size:14px;line-height:1.85;min-height:80px}
  .tb{margin:10px 0;max-width:92%;white-space:pre-wrap;word-break:keep-all}
  .tb.me{margin-left:auto;text-align:right;color:#c9c2b0}
  .tb.wind{color:var(--paper)}
  .tb.lantern{color:var(--paper);padding:8px 10px;border:8px solid transparent;border-image:url(art/frame_hi.png) 16 repeat;image-rendering:pixelated;font-size:13px;line-height:1.75}
  .tb.lantern b{display:block;font-family:var(--px);font-weight:400;font-size:12px;letter-spacing:.3em;color:var(--amber,#ffb26b);margin-bottom:6px}
  .tb.lantern .lb{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .tb.lantern .lb button{background:rgba(7,11,15,.62);border:8px solid transparent;border-image:url(art/frame_btn.png) 16 repeat;image-rendering:pixelated;color:var(--paper);font-family:var(--px);font-size:12px;letter-spacing:.1em;padding:3px 10px;cursor:pointer;text-shadow:1px 1px 0 #000}
  .tb.lantern .lb button:hover,.tb.lantern .lb button:focus-visible{border-image:url(art/frame_hi.png) 16 repeat;outline:none}
  .tb.lantern .lit{color:var(--moss)}
  .tb.lantern .give{display:block;margin-top:8px;font-size:12px;color:var(--dim);line-height:1.7}
  .tb.lantern .give a{color:var(--amber);text-decoration:underline dotted;text-underline-offset:3px}
  .tb.lantern .give a:hover,.tb.lantern .give a:focus-visible{color:var(--paper);outline:none}
  .tb.wind .q{display:block;margin-top:10px;padding:6px 10px;border:8px solid transparent;border-image:url(art/frame_btn.png) 16 repeat;image-rendering:pixelated;color:#b7c7b0;font-size:13px;line-height:1.75}
  .tb.wind .fq{display:block;margin-top:10px;color:#b7c7b0;font-size:13px;line-height:1.7;padding-left:12px;border-left:0;position:relative}
  .tb.wind .fq::before{content:"";position:absolute;left:0;top:.55em;width:5px;height:5px;background:var(--moss)}
  .tb.wind .q small{display:block;color:var(--moss);font-family:var(--px);font-size:11px;letter-spacing:.05em;margin-top:4px}
  .tb.wait{color:var(--moss);font-family:var(--px);font-size:12px;letter-spacing:.3em;animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
  #tin{display:flex;gap:8px;padding:8px 8px 10px;border-top:2px dotted var(--dim)}
  #tin textarea{flex:1;background:rgba(233,228,214,.05);border:8px solid transparent;border-image:url(art/frame_btn.png) 16 repeat;image-rendering:pixelated;color:var(--paper);font-family:var(--pxl);font-size:14px;line-height:1.6;padding:4px 6px;resize:none;height:46px;outline:none;box-sizing:border-box}
  #tin textarea:focus{border-image:url(art/frame_hi.png) 16 repeat}
  #tin button{padding:0 14px;font-size:13px;letter-spacing:.2em}
  #tin button:disabled{opacity:.4;cursor:default}
  #talkbtn{position:absolute;left:50%;bottom:160px;transform:translateX(-50%);pointer-events:auto;font-size:12px;letter-spacing:.2em;padding:3px 12px 3px 30px;background-image:url(art/ic_talk.png);background-repeat:no-repeat;background-position:8px center;background-size:16px 16px}
  body.talking #near,body.talking #breath,body.talking #sign,body.talking #talkbtn,body.talking #toast,body.talking #hint,body.talking #stick,body.talking #snd,body.talking #chr,body.talking #sndp,body.talking #chrp,body.talking #save{display:none}   /* 대화창이 뜨면 소리·캐릭터 버튼과 패널도 숨긴다(폰에서 대화창을 가렸음, 붐 11/9) */
  #ui:has(#sndp:not([hidden])) #stick,#ui:has(#chrp:not([hidden])) #stick,#ui:has(#sndp:not([hidden])) #hint,#ui:has(#chrp:not([hidden])) #hint{display:none}   /* 패널이 열리면 스틱·안내는 잠시 숨긴다(모바일 겹침) */
  .touch #sndp,.touch #chrp{bottom:64px;max-height:62vh;overflow-y:auto;width:min(86vw,300px)}
  .touch #ui:has(#sndp:not([hidden])) #breath,.touch #ui:has(#sndp:not([hidden])) #chr,.touch #ui:has(#chrp:not([hidden])) #breath{display:none}
  #sndp .credit{font-family:var(--px);font-size:11px;letter-spacing:0;color:var(--dim);margin-top:10px;line-height:1.6}
  #stick{position:absolute;left:24px;bottom:36px;width:110px;height:110px;box-sizing:border-box;border:8px solid transparent;border-image:url(art/frame_btn.png) 16 repeat;image-rendering:pixelated;background:rgba(0,0,0,.25);display:none}
  #knob{position:absolute;left:27px;top:27px;width:40px;height:40px;background:rgba(233,228,214,.45);box-shadow:inset 0 0 0 4px rgba(7,11,15,.5)}
  .touch #stick{display:block}
  .touch #hint{bottom:160px}
  #form{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(7,11,15,.55);pointer-events:auto;backdrop-filter:blur(3px)}
  #form[hidden]{display:none}
  #form .card{width:min(86vw,440px);border:14px solid transparent;border-image:url(art/frame.png) 16 fill repeat;image-rendering:pixelated;border-width:16px;padding:6px 10px 6px;font-family:var(--pxl)}
  #form h3{margin:0 0 4px;font-weight:400;font-family:var(--pxl);font-size:17px;letter-spacing:.3em}
  #form .sub{font-family:var(--px);font-size:12px;color:var(--moss);letter-spacing:.05em;margin-bottom:12px}
  #form textarea{width:100%;box-sizing:border-box;height:88px;background:rgba(233,228,214,.05);border:8px solid transparent;border-image:url(art/frame_btn.png) 16 repeat;image-rendering:pixelated;color:var(--paper);font-family:var(--pxl);font-size:15px;line-height:1.7;padding:6px 8px;resize:none;outline:none}
  #form textarea:focus{border-image:url(art/frame_hi.png) 16 repeat}
  #form .cnt{text-align:right;font-family:var(--px);font-size:11px;color:var(--dim);margin:4px 0 12px}
  #form .opts{display:flex;flex-direction:column;gap:6px}
  #form .opts button{font-family:var(--pxl);font-size:14px;letter-spacing:.1em;padding:6px 10px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}
  #form .opts button:disabled{opacity:.42;cursor:not-allowed;filter:none;transform:none}
  #form .opts button small{font-family:var(--px);font-size:11px;color:var(--moss);letter-spacing:0;text-align:right}
  #form .cancel{display:block;margin:12px auto 0;background:none;border:none;color:var(--dim);font-family:var(--px);font-size:12px;letter-spacing:.3em;cursor:pointer}
  #form .cancel:hover{color:var(--paper)}
  #form .warn{display:none;font-family:var(--pxl);font-size:13px;line-height:1.8;color:var(--paper);background:rgba(233,228,214,.06);border:8px solid transparent;border-image:url(art/frame_btn.png) 16 repeat;image-rendering:pixelated;padding:6px 8px;margin:0 0 12px}
  #toast{position:absolute;left:50%;top:9%;transform:translateX(-50%);text-align:center;pointer-events:auto;opacity:0;transition:opacity 1s;max-width:86vw;border:14px solid transparent;border-image:url(art/frame.png) 16 fill repeat;image-rendering:pixelated;padding:2px 12px 8px}
  #toast:not(.on){pointer-events:none}
  #toast.on{opacity:1}
  #toast .n{font-family:var(--pxl);font-size:clamp(18px,3vw,24px);letter-spacing:.2em;text-shadow:2px 2px 0 #000}
  #toast .s{font-family:var(--px);font-size:12px;color:var(--moss);letter-spacing:.1em;margin-top:6px;line-height:1.8}
  #toast button{margin:12px 4px 0;font-size:12px;letter-spacing:.25em;padding:3px 14px}
  #title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070b0f;image-rendering:pixelated;pointer-events:auto;transition:opacity 1.4s;z-index:5;text-align:center;padding:18px 20px;overflow:auto;gap:14px}
  #title::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,15,.15) 0%,rgba(7,11,15,.35) 50%,rgba(7,11,15,.75) 100%);pointer-events:none}
  #title>*{position:relative}
  /* 숲마다 다른 타이틀 배경 4장. 고른 숲(또는 카드에 올린 숲)의 장만 보인다. 그라데이션(::before)과 글은 그 위에 */
  #title .bg{position:absolute;inset:0;z-index:-1;background:#070b0f center/cover no-repeat;image-rendering:pixelated;opacity:0;transition:opacity .6s}
  #title .bg.on{opacity:1}
  #title .bg[data-m="moon"]{background-image:url(art/px_bg_moon.png)}#title .bg[data-m="rain"]{background-image:url(art/px_bg_rain.png)}#title .bg[data-m="sea"]{background-image:url(art/px_bg_sea.png)}#title .bg[data-m="snow"]{background-image:url(art/px_bg_snow.png)}
  #title.hide{opacity:0;pointer-events:none}
  .pxf{border:16px solid transparent;border-image:url(art/frame.png) 16 fill repeat;image-rendering:pixelated}
  #title .card{padding:10px 22px 18px;width:min(88vw,520px);box-sizing:border-box}
  #title .logo{width:clamp(120px,24vw,168px);height:auto;margin:6px auto 0;display:block;filter:drop-shadow(0 0 14px rgba(233,228,214,.28))}
  #title h1{font-family:"Galmuri14","Galmuri11","Hahmlet",serif;font-weight:400;letter-spacing:.5em;font-size:clamp(34px,7.5vw,54px);margin:0;text-indent:.5em;color:var(--paper);text-shadow:3px 3px 0 #070b0f}
  #title h1 small{display:block;font-family:"Galmuri11","Galmuri9",serif;font-size:13px;letter-spacing:.35em;color:var(--moss);margin-top:10px;text-indent:.35em;text-shadow:2px 2px 0 #070b0f}
  #title .rule{width:60%;height:2px;margin:12px auto 0;background:repeating-linear-gradient(90deg,var(--moss) 0 4px,transparent 4px 8px);image-rendering:pixelated}
  #title p{font-family:"Galmuri11",serif;color:#d8d2c2;font-size:13px;line-height:2;margin:12px 0 0;text-shadow:2px 2px 0 #070b0f}
  #title button{background:transparent;border:1px solid rgba(233,228,214,.5);color:var(--paper);font-size:16px;letter-spacing:.45em;padding:12px 36px;cursor:pointer;text-indent:.45em;transition:.2s}
  #title .foot{margin-top:4px;font-family:var(--px);font-size:11px;letter-spacing:.3em;color:var(--dim)}
  #title .q{font-family:"Galmuri11",serif;font-size:12px;letter-spacing:.4em;color:var(--moss);margin:0 0 -2px}
  #servers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(88vw,520px)}
